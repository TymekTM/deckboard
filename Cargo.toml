[workspace]
resolver = "2"
members = ["crates/db", "crates/actions", "crates/proto", "crates/legacy", "crates/ext", "crates/vm", "crates/discord", "crates/sysinfo", "crates/aidev", "crates/os", "crates/v2", "crates/backend", "apps/server", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# feature trim over "full": rt/macros/net/sync/time is everything the
# workspace uses (spawn_blocking lives behind "rt"); keeps the binary
# image and its resident pages smaller
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time"] }
axum = { version = "0.7", features = ["ws"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
enigo = "0.2"
open = "5"
rand = "0.8"
futures-util = "0.3"
tokio-tungstenite = "0.24"
ts-rs = { version = "12", features = ["serde-json-impl"] }
base64 = "0.23"
sha2 = "0.10"
hex = "0.4"

# smaller image = fewer resident pages; LTO + one CGU deduplicate Boa and
# the stack of async helpers, strip drops symbols nobody loads at runtime
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
