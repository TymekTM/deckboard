<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Pulpit architecture</title>
  <desc id="arch-desc">The Windows desktop app (editor, touch mode and an embedded server on port 8500) talks to the stock Deckboard Android client over the legacy APP_CUSTOM_VALUE protocol and to the native Pulpit Android app over v2 sessions, with mDNS discovery and numeric-code pairing. AI usage data from z.ai GLM, Claude, Codex and OpenRouter feeds the desktop.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#0f1624"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="529" rx="16" fill="url(#bg)" stroke="#30363d"/>

  <!-- ===== Windows desktop ===== -->
  <rect x="30" y="30" width="410" height="470" rx="14" fill="#0d1117" stroke="#30363d"/>
  <g font-family="sans-serif">
    <text x="50" y="62" font-size="16" font-weight="bold" fill="#e6edf3">Windows desktop</text>
    <text x="50" y="80" font-size="12" fill="#8b949e">Rust + Tauri 2 app, Vue 3 frontend</text>
  </g>

  <!-- editor + touch mode -->
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="50" y="96" width="175" height="48" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="137" y="117" font-size="13" font-weight="bold" fill="#c9d1d9">Board editor</text>
    <text x="137" y="134" font-size="11" fill="#8b949e">tiles, drag, resize, dual state</text>

    <rect x="235" y="96" width="175" height="48" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="322" y="117" font-size="13" font-weight="bold" fill="#c9d1d9">Touch mode</text>
    <text x="322" y="134" font-size="11" fill="#8b949e">board as execution surface</text>

    <rect x="50" y="154" width="175" height="42" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="137" y="172" font-size="13" font-weight="bold" fill="#c9d1d9">Command engine</text>
    <text x="137" y="187" font-size="11" fill="#8b949e">volume, macros, screenshots</text>

    <rect x="235" y="154" width="175" height="42" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="322" y="172" font-size="13" font-weight="bold" fill="#c9d1d9">Self-updater</text>
    <text x="322" y="187" font-size="11" fill="#8b949e">sha256-verified feed</text>
  </g>

  <!-- live state sources -->
  <rect x="50" y="208" width="360" height="86" rx="9" fill="#161b22" stroke="#30363d"/>
  <text x="62" y="228" font-family="sans-serif" font-size="12" fill="#8b949e">Live state sources</text>
  <g font-family="sans-serif" font-size="11" text-anchor="middle" fill="#c9d1d9">
    <rect x="62" y="240" width="108" height="40" rx="8" fill="#0d1117" stroke="#3fb950"/>
    <text x="116" y="257">sysinfo</text>
    <text x="116" y="271" fill="#8b949e">CPU, RAM, audio</text>
    <rect x="182" y="240" width="108" height="40" rx="8" fill="#0d1117" stroke="#a371f7"/>
    <text x="236" y="257">.asar extensions</text>
    <text x="236" y="271" fill="#8b949e">user plugins</text>
    <rect x="302" y="240" width="96" height="40" rx="8" fill="#0d1117" stroke="#d29922"/>
    <text x="350" y="257">AI usage</text>
    <text x="350" y="271" fill="#8b949e">plan limits</text>
  </g>

  <!-- embedded server -->
  <rect x="50" y="310" width="370" height="180" rx="11" fill="#0f1c2e" stroke="#58a6ff" stroke-width="1.5"/>
  <g font-family="sans-serif">
    <text x="66" y="334" font-size="14" font-weight="bold" fill="#e6edf3">Embedded server</text>
    <text x="404" y="334" font-size="14" font-weight="bold" text-anchor="end" fill="#58a6ff">:8500</text>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#c9d1d9">
    <rect x="66" y="347" width="274" height="26" rx="7" fill="#0d1117" stroke="#58a6ff"/>
    <text x="78" y="364">legacy: Engine.IO v3 / socket.io v2</text>
    <rect x="66" y="417" width="274" height="26" rx="7" fill="#0d1117" stroke="#3fb950"/>
    <text x="78" y="434">v2: plain WebSocket, typed schema</text>
    <rect x="66" y="449" width="274" height="26" rx="7" fill="#0d1117" stroke="#a371f7"/>
    <text x="78" y="466">mDNS: advertises _pulpit._tcp</text>
  </g>
  <text x="66" y="396" font-family="sans-serif" font-size="11" fill="#8b949e">one port, two protocols</text>

  <!-- ===== AI usage sources ===== -->
  <rect x="480" y="40" width="300" height="240" rx="14" fill="#0d1117" stroke="#30363d"/>
  <g font-family="sans-serif">
    <text x="500" y="68" font-size="14" font-weight="bold" fill="#e6edf3">AI usage sources</text>
    <text x="500" y="86" font-size="11" fill="#8b949e">polled by the desktop, pushed to tablets</text>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#c9d1d9">
    <text x="500" y="116">z.ai GLM</text>
    <rect x="590" y="108" width="170" height="8" rx="4" fill="#30363d"/>
    <rect x="590" y="108" width="62" height="8" rx="4" fill="#3fb950">
      <animate attributeName="width" values="62;74;62" dur="9s" repeatCount="indefinite"/>
    </rect>
    <text x="500" y="146">Claude</text>
    <rect x="590" y="138" width="170" height="8" rx="4" fill="#30363d"/>
    <rect x="590" y="138" width="104" height="8" rx="4" fill="#d29922">
      <animate attributeName="width" values="104;112;104" dur="11s" repeatCount="indefinite"/>
    </rect>
    <text x="500" y="176">Codex</text>
    <rect x="590" y="168" width="170" height="8" rx="4" fill="#30363d"/>
    <rect x="590" y="168" width="40" height="8" rx="4" fill="#3fb950">
      <animate attributeName="width" values="40;52;40" dur="10s" repeatCount="indefinite"/>
    </rect>
    <text x="500" y="206">OpenRouter</text>
    <rect x="590" y="198" width="170" height="8" rx="4" fill="#30363d"/>
    <rect x="590" y="198" width="78" height="8" rx="4" fill="#3fb950">
      <animate attributeName="width" values="78;86;78" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#8b949e">
    <text x="500" y="238">plan limits per provider window; reset</text>
    <text x="500" y="254">countdowns where the source reports one</text>
  </g>

  <!-- AI data flows into the desktop -->
  <path d="M480,260 H410" fill="none" stroke="#d29922" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="12" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <polygon points="410,260 420,255 420,265" fill="#d29922"/>

  <!-- ===== lanes ===== -->
  <!-- legacy lane -->
  <path d="M420,360 H790" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-12" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <polygon points="800,360 790,355 790,365" fill="#58a6ff"/>
  <polygon points="420,360 430,355 430,365" fill="#58a6ff"/>
  <rect x="470" y="348" width="290" height="24" rx="8" fill="#0d1117" stroke="#58a6ff"/>
  <text x="615" y="364" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#c9d1d9">legacy lane: APP_CUSTOM_VALUE</text>

  <!-- v2 lane -->
  <path d="M420,430 H790" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-12" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <polygon points="800,430 790,425 790,435" fill="#3fb950"/>
  <polygon points="420,430 430,425 430,435" fill="#3fb950"/>
  <rect x="470" y="418" width="290" height="24" rx="8" fill="#0d1117" stroke="#3fb950"/>
  <text x="615" y="434" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#c9d1d9">v2 lane: sessions, delta sync, per-device tokens</text>

  <!-- mDNS lane -->
  <path d="M420,462 H790" fill="none" stroke="#a371f7" stroke-width="2" stroke-dasharray="3 7">
    <animate attributeName="stroke-dashoffset" from="0" to="-10" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <polygon points="800,462 790,457 790,467" fill="#a371f7"/>
  <rect x="470" y="450" width="290" height="24" rx="8" fill="#0d1117" stroke="#a371f7"/>
  <text x="615" y="466" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#c9d1d9">_pulpit._tcp discovery + numeric-code pairing</text>

  <!-- ===== tablets ===== -->
  <rect x="800" y="320" width="370" height="80" rx="12" fill="#0d1117" stroke="#58a6ff"/>
  <g font-family="sans-serif">
    <text x="820" y="350" font-size="14" font-weight="bold" fill="#e6edf3">Stock Deckboard Android client</text>
    <text x="820" y="370" font-size="12" fill="#8b949e">Deckboard 3.x, Free and Pro</text>
    <text x="820" y="388" font-size="11" fill="#8b949e">scan the QR in "Connect a tablet"</text>
  </g>

  <rect x="800" y="410" width="370" height="90" rx="12" fill="#0d1117" stroke="#3fb950"/>
  <g font-family="sans-serif">
    <text x="820" y="438" font-size="14" font-weight="bold" fill="#e6edf3">Pulpit Android app</text>
    <text x="820" y="458" font-size="12" fill="#8b949e">native client, Kotlin / Compose</text>
    <text x="820" y="478" font-size="11" fill="#8b949e">browses mDNS, pairs with a numeric code</text>
  </g>

  <!-- ===== legend ===== -->
  <rect x="830" y="40" width="340" height="240" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text x="850" y="68" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e6edf3">Lanes</text>
  <g font-family="sans-serif" font-size="12" fill="#c9d1d9">
    <line x1="850" y1="96" x2="890" y2="96" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="902" y="100">legacy: stock client, same port</text>
    <line x1="850" y1="128" x2="890" y2="128" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="902" y="132">v2: Pulpit protocol sessions</text>
    <line x1="850" y1="160" x2="890" y2="160" stroke="#a371f7" stroke-width="2" stroke-dasharray="3 7"/>
    <text x="902" y="164">mDNS discovery and pairing</text>
    <line x1="850" y1="192" x2="890" y2="192" stroke="#d29922" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="902" y="196">AI usage data into the desktop</text>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#8b949e">
    <text x="850" y="232">Live state (buttons, sliders, toggles,</text>
    <text x="850" y="248">sysinfo, AI usage) is broadcast to every</text>
    <text x="850" y="264">connected client over both lanes.</text>
  </g>
</svg>
