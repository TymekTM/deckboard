name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Live device tests (real audio, screen capture, Discord pipe) are
      # #[ignore]d, so the suite is safe on a CI runner.
      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend build
        working-directory: apps/desktop
        run: |
          npm ci
          npx vite build
